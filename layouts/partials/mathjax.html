<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  }
};

window.typesetMath = function(root, retries) {
  if (window.MathJax && window.MathJax.typesetPromise) {
    var target = root || document.querySelector('.post-content') || document.body;
    if (window.MathJax.typesetClear) {
      window.MathJax.typesetClear([target]);
    }
    window.MathJax.typesetPromise([target]).catch(function(error) {
      console.error('MathJax typesetting failed:', error);
    });
    return;
  }

  if ((retries || 0) < 20) {
    window.setTimeout(function() {
      window.typesetMath(root, (retries || 0) + 1);
    }, 100);
  }
};

document.addEventListener('DOMContentLoaded', function() {
  if (window.InstantClick && !window.__mathJaxInstantClickBound) {
    window.InstantClick.on('change', function() {
      window.typesetMath(document.querySelector('.post-content'));
    });
    window.__mathJaxInstantClickBound = true;
  }
});
</script>

<script async
        data-no-instant
        src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js">
</script>

<style>
mjx-container[display="true"] {
  overflow-x: auto;
  overflow-y: hidden;
}
</style>
